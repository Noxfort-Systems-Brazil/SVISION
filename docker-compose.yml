# SVision Docker Compose Specification
version: "3.8"

services:
  svision-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: svision-core-engine
    restart: unless-stopped
    network_mode: host
    environment:
      - SVISION_ENV=production
      - SVISION_SYNAPSE_HOST=127.0.0.1
      - SVISION_SYNAPSE_BASE_PORT=9001
      - SVISION_SYNAPSE_UDS_PATH=/tmp/svision_synapse.sock
    volumes:
      - svision-data:/root/Documents/Svision/database
      - /tmp:/tmp
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  svision-data:
    driver: local
